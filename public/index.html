<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fih</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-screen" class="screen">
    <h2>FISH Multiplayer</h2>
    <input type="text" id="username-input" placeholder="enter yo name" />
    <br><br>
    <button onclick="login()">Connect</button>
  </div>

  <div id="rooms-screen" class="screen">
    <div class="layout-container">
      <div class="main-column">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 id="welcome-message">Welcome!</h2>
          <button class="btn-secondary" onclick="changeName()">Change Name</button>
        </div>
        <hr>
        <h3>Create a New Game</h3>
        <input type="text" id="new-room-input" placeholder="e.g. Ms. Dih-claires vs. Ida Claire" />
        <button onclick="createGame()">Create Game</button>
        <hr>
        <h3>Available Games</h3>
        <div id="active-games-list">
        </div>
      </div>
      
      <div class="sidebar-column">
        <div class="sidebar-box">
          <h2>Players Online</h2>
          <ul id="global-player-list" class="player-list-style"></ul>
        </div>
        
        <div class="sidebar-box">
          <h3>Lobby Chat</h3>
          <div class="chat-box" id="lobby-chat-box"></div>
          <div id="lobby-typing-indicator" class="typing-indicator"></div>
          <form class="chat-form" onsubmit="sendChat(event, 'lobby')">
              <input id="lobby-chat-input" autocomplete="off" placeholder="yapathon.." oninput="handleTyping('lobby')" />
              <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="game-screen" class="screen">
    <div class="layout-container">
      <div class="main-column">
        <h1 id="current-room-title">FISH Room</h1>
        <p>Waiting for players... (Max 6)</p>
        
        <button id="start-game-btn" class="btn-start" onclick="startGame()" style="display: none;">Start Game</button>
        <button class="btn-info" onclick="switchTeam()">Switch Team</button>
        <button class="btn-secondary" onclick="leaveGame()" style="margin-top: 15px;">Leave Game</button>
      </div>
      
      <div class="sidebar-column">
        <div class="sidebar-box">
          <h2>Teams</h2>
          <h3>Team 1</h3>
          <ul id="team-1-list" class="player-list-style"></ul>
          
          <h3>Team 2</h3>
          <ul id="team-2-list" class="player-list-style"></ul>
        </div>

        <div class="sidebar-box">
          <h3>Room Chat</h3>
          <div class="chat-box" id="room-chat-box"></div>
          <div id="room-typing-indicator" class="typing-indicator"></div>
          <form class="chat-form" onsubmit="sendChat(event, 'room')">
              <input id="room-chat-input" autocomplete="off" placeholder="yap..." oninput="handleTyping('room')" />
              <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="gameplay-screen" class="screen">
    <div class="layout-container">
      <div class="main-column">
        <h2>Hand</h2>
        <div id="my-hand" class="hand-container"></div>
        
        <button id="ask-btn" class="btn-ask" onclick="askCard()">tienes?</button>
      </div>
    </div>
  </div>

  <script>
    let myId = sessionStorage.getItem('fish_player_id');
    let socket; 
    
    let typingUsersLobby = [];
    let typingUsersRoom = [];
    let typingTimeout;

    if (myId) {
      document.getElementById('username-input').value = myId;
      login();
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
      document.getElementById(screenId).style.display = 'block';
    }

    function login() {
      const typedName = document.getElementById('username-input').value;
      if (typedName.trim() === "") return alert("enter yo name");

      myId = typedName.trim();
      sessionStorage.setItem('fish_player_id', myId);
      
      document.getElementById('welcome-message').innerText = `Welcome, ${myId}!`;
      showScreen('rooms-screen');

      if (!socket) {
        socket = io();
        
        socket.on('connect', () => {
          socket.emit('register_player', myId);
        });

        socket.on('error_message', (msg) => {
          alert(msg);
        });

        socket.on('global_player_list', (playerNames) => {
          const list = document.getElementById('global-player-list');
          list.innerHTML = ''; 
          playerNames.forEach(name => {
            const li = document.createElement('li');
            li.innerText = name === myId ? `${name} (You)` : name;
            list.appendChild(li);
          });
        });

        socket.on('game_list_updated', (games) => {
          updateGameListUI(games);
        });

        socket.on('room_data_updated', (roomData) => {
          const team1List = document.getElementById('team-1-list');
          const team2List = document.getElementById('team-2-list');
          
          team1List.innerHTML = ''; 
          team2List.innerHTML = '';
          
          roomData.players.forEach((playerObj) => {
            const playerId = playerObj.name;
            const listItem = document.createElement('li');
            
            let nameText = playerId;
            if (playerId === myId) nameText += " (You)";
            if (playerId === roomData.host) nameText += " (Group Leader)"; 

            const nameSpan = document.createElement('span');
            nameSpan.innerHTML = playerId === myId ? `<strong>${nameText}</strong>` : nameText;
            listItem.appendChild(nameSpan);

            if (myId === roomData.host && playerId !== myId) {
              const kickBtn = document.createElement('button');
              kickBtn.innerText = 'Kick';
              kickBtn.className = 'btn-kick';
              kickBtn.onclick = () => kickPlayer(playerId);
              listItem.appendChild(kickBtn);
            }
            
            if (playerObj.team === 1) {
              team1List.appendChild(listItem);
            } else {
              team2List.appendChild(listItem);
            }
          });

          const startBtn = document.getElementById('start-game-btn');
          if (myId === roomData.host) {
            startBtn.style.display = 'inline-block';
          } else {
            startBtn.style.display = 'none';
          }
        });

        socket.on('kicked_from_room', () => {
          alert('Immanuel threw a brick at your head and you died. #RIP');
          document.getElementById('team-1-list').innerHTML = ''; 
          document.getElementById('team-2-list').innerHTML = '';
          document.getElementById('room-chat-box').innerHTML = ''; 
          showScreen('rooms-screen');
        });

        socket.on('global_chat_message', (data) => {
          const box = document.getElementById('lobby-chat-box');
          box.innerHTML += `<div class="chat-message"><strong>${data.sender}:</strong> ${data.text}</div>`;
          box.scrollTop = box.scrollHeight;
        });

        socket.on('room_chat_message', (data) => {
          const box = document.getElementById('room-chat-box');
          box.innerHTML += `<div class="chat-message"><strong>${data.sender}:</strong> ${data.text}</div>`;
          box.scrollTop = box.scrollHeight;
        });

        socket.on('user_typing', (data) => {
          let targetArray = data.context === 'lobby' ? typingUsersLobby : typingUsersRoom;
          let indicatorId = data.context === 'lobby' ? 'lobby-typing-indicator' : 'room-typing-indicator';

          if (data.isTyping && !targetArray.includes(data.name)) {
            targetArray.push(data.name);
          } else if (!data.isTyping) {
            const index = targetArray.indexOf(data.name);
            if (index > -1) targetArray.splice(index, 1);
          }

          let text = '';
          if (targetArray.length === 1) text = `${targetArray[0]} is typing...`;
          else if (targetArray.length > 1) text = 'Several people are typing...';

          document.getElementById(indicatorId).innerText = text;
        });

        socket.on('game_started', () => {
          showScreen('gameplay-screen');
        });

        socket.on('receive_hand', (hand) => {
          const handContainer = document.getElementById('my-hand');
          handContainer.innerHTML = '';
          
          hand.forEach(card => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'playing-card';
            cardDiv.innerText = `Suit ${card[0]} \n Rank ${card[1]}`;
            handContainer.appendChild(cardDiv);
          });
        });

      } else {
        socket.emit('register_player', myId);
      }
    }

    function changeName() {
      const newName = prompt("wow so indecisive... enter ur new name:", myId);
      if (newName && newName.trim() !== "") {
        myId = newName.trim();
        sessionStorage.setItem('fish_player_id', myId);
        document.getElementById('welcome-message').innerText = `Welcome, ${myId}!`;
        socket.emit('register_player', myId);
      }
    }

    function createGame() {
      const roomName = document.getElementById('new-room-input').value;
      if (roomName.trim() === "") return alert("Enter a room name cuh");
      
      document.getElementById('current-room-title').innerText = `Room: ${roomName}`;
      document.getElementById('room-chat-box').innerHTML = '';
      socket.emit('create_game', roomName);
      showScreen('game-screen');
    }

    function joinGame(roomName) {
      document.getElementById('current-room-title').innerText = `Room: ${roomName}`;
      document.getElementById('room-chat-box').innerHTML = '';
      socket.emit('join_game', roomName);
      showScreen('game-screen');
    }

    function leaveGame() {
      socket.emit('leave_game');
      document.getElementById('team-1-list').innerHTML = ''; 
      document.getElementById('team-2-list').innerHTML = '';
      document.getElementById('room-chat-box').innerHTML = ''; 
      showScreen('rooms-screen');
    }

    function switchTeam() {
      socket.emit('switch_team');
    }

    function kickPlayer(playerName) {
      socket.emit('kick_player', playerName);
    }

    function startGame() {
      socket.emit('start_game');
    }

    function askCard() {
      alert("something probably maybe worked");
    }

    function handleTyping(context) {
      socket.emit('typing', { context: context, isTyping: true });
      clearTimeout(typingTimeout);
      
      typingTimeout = setTimeout(() => {
        socket.emit('typing', { context: context, isTyping: false });
      }, 2000);
    }

    function sendChat(event, context) {
      event.preventDefault(); 
      const input = document.getElementById(`${context}-chat-input`);
      const msg = input.value;
      
      if (msg.trim() !== '') {
        socket.emit('chat_message', msg);
        input.value = '';
        
        socket.emit('typing', { context: context, isTyping: false });
        clearTimeout(typingTimeout);
      }
    }

    function updateGameListUI(games) {
      const listContainer = document.getElementById('active-games-list');
      listContainer.innerHTML = '';

      const gameNames = Object.keys(games);
      
      if (gameNames.length === 0) {
        listContainer.innerHTML = '<p>No active games right now (go touch grass)... #fairs</p>';
        return;
      }

      gameNames.forEach(roomName => {
        const playerCount = games[roomName].players.length;
        const isFull = playerCount >= 6;
        
        const gameDiv = document.createElement('div');
        gameDiv.className = 'game-item';
        
        gameDiv.innerHTML = `
          <span>${roomName} (${playerCount}/6 players)</span>
          <button onclick="joinGame('${roomName}')" ${isFull ? 'disabled' : ''}>
            ${isFull ? 'FULL' : 'Join Game'}
          </button>`
        ;
        
        listContainer.appendChild(gameDiv);
      });
    }
  </script>
</body>
</html>
